spring.application.name=springboot-ajcaptcha-plus
server.port=9094

# ==================== 验证码开关 ====================
# 生产环境保持开启；开发/压测环境可改为 false 一键跳过验证码
captcha.enable=true

# ==================== AJ-Captcha（captcha-plus）配置 ====================
# 验证码类型：blockPuzzle 滑动拼图 / clickWord 文字点选 / default 两种都实例化
aj.captcha.type=default
# 缓存类型：local 内存缓存（仅适合单机部署）/ redis（分布式部署，见 META-INF/services SPI 注册）
aj.captcha.cache-type=local
# 右下角水印文字
aj.captcha.water-mark=springboot-demo
# 滑动拼图校验允许误差偏移量（默认 5 像素）
aj.captcha.slip-offset=5
# 滑动拼图干扰项（0/1/2）
aj.captcha.interference-options=2
# 前端提交坐标是否 AES 加密（前端使用官方 ase.js 中的固定密钥，保持默认开启即可）
aj.captcha.aes-status=true
# local 缓存阈值，达到后清除缓存
aj.captcha.cache-number=1000
# local 定时清理过期缓存（单位秒）
aj.captcha.timing-clear=180

# ---- 接口频控：验证码接口本身的防刷限流 ----
aj.captcha.req-frequency-limit-enable=true
# 验证失败 5 次锁定 get 接口
aj.captcha.req-get-lock-limit=5
# 锁定时长（秒）
aj.captcha.req-get-lock-seconds=10
# get 接口一分钟内请求数上限
aj.captcha.req-get-minute-limit=30
# check 接口一分钟内请求数上限
aj.captcha.req-check-minute-limit=60
# verification 接口一分钟内请求数上限
aj.captcha.req-verify-minute-limit=60

# ==================== 生产环境：切换 Redis 缓存 ====================
# 1) 打开 aj.captcha.cache-type=redis
# 2) 本地/远程启动 Redis，并配置连接信息
#aj.captcha.cache-type=redis
#spring.data.redis.host=localhost
#spring.data.redis.port=6379
