spring.application.name=springboot-sms-login
server.port=9092

# ==================== 短信发送实现切换 ====================
# log    = 日志模拟（默认，本地调试，无需真实短信账号）
# aliyun = 阿里云短信 SDK 直连
# sms4j  = sms4j 聚合框架（配置多厂商、运行期可切换）
sms.provider=log

# ==================== 短信验证码配置 ====================
# 验证码有效期（分钟）
sms.code.expire-minutes=5
# 同一手机号两次发送的最小间隔（秒），防短信轰炸
sms.code.resend-interval-seconds=60
# 单个验证码允许的最大错误次数，防暴力试错
sms.code.max-attempts=5

# ==================== 阿里云短信 SDK（sms.provider=aliyun 时生效） ====================
# AccessKey 建议使用 RAM 子账号并只授予 AliyunDysmsFullAccess 权限；生产环境用环境变量注入，不要提交到仓库
sms.aliyun.access-key-id=您的AccessKey ID
sms.aliyun.access-key-secret=您的AccessKey Secret
# 已审核通过的短信签名
sms.aliyun.sign-name=您的短信签名
# 已审核通过的模板 CODE，模板示例：您的验证码为${code}，5分钟内有效
sms.aliyun.template-code=SMS_xxxxxxxx
# 短信 API 接入点，一般不用改
sms.aliyun.endpoint=dysmsapi.aliyuncs.com

# ==================== sms4j 聚合框架（sms.provider=sms4j 时生效） ====================
# 标注从 yml/properties 读取厂商配置（另一种方式是实现 SmsReadConfig 接口从数据库等动态读取）
sms.config-type=yaml
# blends 下可同时配置多个厂商实例，aliyun1 为自定义 configId，发送时按它获取实例
sms.blends.aliyun1.supplier=alibaba
sms.blends.aliyun1.access-key-id=您的AccessKey ID
sms.blends.aliyun1.access-key-secret=您的AccessKey Secret
# 已审核通过的短信签名
sms.blends.aliyun1.signature=您的短信签名
# 已审核通过的模板 ID
sms.blends.aliyun1.template-id=SMS_xxxxxxxx
# 模板变量名，与模板中的 ${code} 对应
sms.blends.aliyun1.template-name=code
# sms4j 发送验证码使用的实例标识（对应上面的 blends key）
sms4j.config-id=aliyun1
