<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - Hutool 验证码示例</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  }

  .login-card {
    width: 380px;
    background: #fff;
    border-radius: 12px;
    padding: 40px 36px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, .25);
  }

  .login-card h1 {
    font-size: 22px;
    color: #333;
    text-align: center;
    margin-bottom: 28px;
  }

  .form-item { margin-bottom: 18px; }

  .form-item label {
    display: block;
    font-size: 13px;
    color: #666;
    margin-bottom: 6px;
  }

  .form-item input[type="text"],
  .form-item input[type="password"] {
    width: 100%;
    height: 42px;
    padding: 0 12px;
    border: 1px solid #dcdfe6;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
  }

  .form-item input:focus { border-color: #667eea; }

  .captcha-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .captcha-row input { flex: 1; }

  /* 验证码图片：200x100，展示时缩放为高 42px，点击可刷新 */
  #captchaImg {
    height: 42px;
    width: 84px;
    border: 1px solid #dcdfe6;
    border-radius: 6px;
    cursor: pointer;
    background: #f5f7fa;
  }

  .captcha-tip {
    font-size: 12px;
    color: #999;
    margin-top: 6px;
  }

  select {
    height: 30px;
    border: 1px solid #dcdfe6;
    border-radius: 6px;
    font-size: 12px;
    color: #666;
    padding: 0 6px;
    outline: none;
  }

  .btn-login {
    width: 100%;
    height: 44px;
    margin-top: 6px;
    border: none;
    border-radius: 6px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    transition: opacity .2s;
  }

  .btn-login:hover { opacity: .9; }

  #result {
    margin-top: 14px;
    font-size: 14px;
    text-align: center;
    min-height: 20px;
  }

  #result.ok { color: #67c23a; }
  #result.fail { color: #f56c6c; }
</style>
</head>
<body>
<div class="login-card">
  <h1>用户登录</h1>

  <div class="form-item">
    <label for="username">用户名</label>
    <input type="text" id="username" placeholder="请输入用户名" value="admin">
  </div>

  <div class="form-item">
    <label for="password">密码</label>
    <input type="password" id="password" placeholder="请输入密码">
  </div>

  <div class="form-item">
    <label for="code">验证码</label>
    <div class="captcha-row">
      <input type="text" id="code" placeholder="请输入验证码" maxlength="4" autocomplete="off">
      <!-- 后端接口：GET /captcha/{type}，返回图片流；点击图片刷新 -->
      <img id="captchaImg" src="/captcha/line" alt="验证码，点击刷新" title="点击刷新">
    </div>
    <div class="captcha-tip">
      类型：
      <select id="captchaType">
        <option value="line" selected>线段干扰</option>
        <option value="circle">圆圈干扰</option>
        <option value="shear">扭曲</option>
        <option value="gif">GIF 动图</option>
      </select>
      <span>看不清？点击图片刷新</span>
    </div>
  </div>

  <button class="btn-login" id="loginBtn">登 录</button>
  <div id="result"></div>
</div>

<script>
  const API_BASE = ''; // 与后端同源部署时无需修改；若跨域部署请改为如 http://localhost:9090

  const captchaImg = document.getElementById('captchaImg');
  const captchaType = document.getElementById('captchaType');
  const resultEl = document.getElementById('result');

  // 加时间戳防止浏览器缓存，保证每次都拿到新验证码（后端同时依赖 Session 绑定验证码文本）
  function refreshCaptcha() {
    const type = captchaType.value;
    captchaImg.src = `${API_BASE}/captcha/${type}?t=${Date.now()}`;
  }

  captchaImg.addEventListener('click', refreshCaptcha);
  captchaType.addEventListener('change', refreshCaptcha);

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const code = document.getElementById('code').value.trim();
    resultEl.textContent = '';
    resultEl.className = '';

    if (!code) {
      resultEl.textContent = '请输入验证码';
      resultEl.className = 'fail';
      return;
    }

    try {
      // 必须带 credentials，验证码文本存在 Session 中，校验接口依赖 JSESSIONID Cookie
      const resp = await fetch(`${API_BASE}/captcha/verify?code=${encodeURIComponent(code)}`, {
        credentials: 'same-origin'
      });
      const msg = await resp.text();
      const ok = msg.includes('验证通过');
      resultEl.textContent = msg;
      resultEl.className = ok ? 'ok' : 'fail';
    } catch (e) {
      resultEl.textContent = '请求失败：' + e.message;
      resultEl.className = 'fail';
    }

    // 验证码是一次性消费，无论成败都刷新
    refreshCaptcha();
    document.getElementById('code').value = '';
  });
</script>
</body>
</html>
