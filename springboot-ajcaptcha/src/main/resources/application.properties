spring.application.name=springboot-ajcaptcha
server.port=9091

# ==================== AJ-Captcha 行为验证码配置 ====================
# 验证码类型：blockPuzzle 滑动拼图 / clickWord 文字点选 / default 两种都实例化
aj.captcha.type=default
# 底图路径：不配置则使用 jar 内置默认底图；自定义时放到 resources 下，如 classpath:images/jigsaw
#aj.captcha.jigsaw=classpath:images/jigsaw
#aj.captcha.pic-click=classpath:images/pic-click
# 缓存类型：local 内存缓存（仅适合单机部署）/ redis（分布式部署需自行实现 CaptchaCacheService）
aj.captcha.cache-type=local
# 右下角水印文字
aj.captcha.water-mark=springboot-demo
# 滑动拼图校验允许误差偏移量（默认 5 像素）
aj.captcha.slip-offset=5
# 滑动拼图干扰项（0/1/2）
aj.captcha.interference-options=2
# 前端提交坐标是否 AES 加密（前端使用官方 ase.js 中的固定密钥，保持默认开启即可）
aj.captcha.aes-status=true
# local 缓存阈值，达到后清除缓存
aj.captcha.cache-number=1000
# local 定时清理过期缓存（单位秒）
aj.captcha.timing-clear=180
