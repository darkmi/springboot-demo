spring.application.name=springboot-email-login
server.port=9093

# ==================== SMTP 邮件服务器配置（以 QQ 邮箱为例） ====================
# QQ 邮箱 SMTP 服务器地址；网易 163 邮箱为 smtp.163.com，企业邮箱以服务商文档为准
spring.mail.host=smtp.qq.com
# SSL 加密端口
spring.mail.port=465
# 发件邮箱地址
spring.mail.username=your-email@qq.com
# 授权码（不是邮箱登录密码！QQ 邮箱在「设置-账号-POP3/SMTP 服务」开启后生成）
spring.mail.password=your-auth-code
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ==================== 邮箱验证码配置 ====================
# 验证码有效期（分钟）
email.code.expire-minutes=10
# 同一邮箱两次发送的最小间隔（秒），防邮件轰炸
email.code.resend-interval-seconds=60
# 单个验证码允许的最大错误次数，防暴力试错
email.code.max-attempts=5
