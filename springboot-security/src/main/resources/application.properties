spring.application.name=springboot-security
server.port=9096

# SQLite 数据库文件（相对模块工作目录；目录不存在时 sqlite-jdbc 不会自动创建父目录，故用平铺路径）
spring.datasource.url=jdbc:sqlite:security-demo.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite 同一文件同一时刻只允许一个写连接，连接池固定为 1 避免写锁冲突
spring.datasource.hikari.maximum-pool-size=1

# 启动时执行 classpath:schema.sql 建表（IF NOT EXISTS，幂等）
spring.sql.init.mode=always

# 开发期关闭 Thymeleaf 模板缓存
spring.thymeleaf.cache=false
