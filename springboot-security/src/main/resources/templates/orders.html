<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('订单管理')}"></head>
<body>
<div class="layout">
    <div th:replace="~{fragments :: sidebar('orders')}"></div>
    <main class="content">
        <h1>订单管理</h1>
        <div class="card">
            <table>
                <thead>
                <tr><th>订单号</th><th>金额（元）</th><th>状态</th></tr>
                </thead>
                <tbody>
                <tr th:each="o : ${orders}">
                    <td th:text="${o.order_no}">ORD-001</td>
                    <td th:text="${o.amount}">0.00</td>
                    <td th:text="${o.status}">PAID</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
