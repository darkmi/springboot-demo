<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录 · Shiro Demo</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body class="login-body">
<div class="login-box">
    <h1>Shiro Demo</h1>
    <form th:action="@{/login}" method="post">
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" th:value="${username}" required autofocus>
        <label for="password">密码</label>
        <input id="password" name="password" type="password" required>
        <button type="submit">登 录</button>
        <p class="error" th:if="${loginError}" th:text="${loginError}">用户名或密码错误</p>
    </form>
    <p class="tip">演示账号：admin / 123456（全部功能）；useradmin / 123456（用户管理）；orderadmin / 123456（订单管理）</p>
</div>
</body>
</html>
