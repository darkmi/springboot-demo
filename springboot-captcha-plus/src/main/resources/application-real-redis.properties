# ==================== 模式三：真实 Redis（本机/远程已安装 Redis 时使用） ====================
# 启动方式：--spring.profiles.active=real-redis
# 与 fake-redis 模式的唯一区别是连真实的 Redis 服务端，应用代码零改动。

# 切换验证码缓存实现为 redis
aj.captcha.cache-type=redis

# Redis 连接信息：按本机实际安装情况修改
spring.data.redis.host=localhost
spring.data.redis.port=6379
#spring.data.redis.username=
#spring.data.redis.password=
