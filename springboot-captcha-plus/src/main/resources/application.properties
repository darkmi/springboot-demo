spring.application.name=springboot-captcha-plus
server.port=9094

# ==================== 验证码开关 ====================
# 生产环境保持开启；开发/压测环境可改为 false 一键跳过验证码
captcha.enable=true

# ==================== AJ-Captcha（captcha-plus）配置 ====================
# 验证码类型：default 为路由模式，按请求体 captchaType 分发到 SPI 注册的实现。
# blockPuzzle 滑块拼图 / clickWord 文字点选（库内置）、pictureWord 图形文字（本项目 SPI 扩展，见 META-INF/services）
aj.captcha.type=default
# 缓存类型：local 内存缓存（仅适合单机部署）/ redis（分布式部署，见 META-INF/services SPI 注册）
aj.captcha.cache-type=local
# 右下角水印文字
aj.captcha.water-mark=springboot-demo
# 滑动拼图校验允许误差偏移量（默认 5 像素）
aj.captcha.slip-offset=5
# 滑动拼图干扰项（0/1/2）
aj.captcha.interference-options=2
# 前端提交坐标是否 AES 加密（前端使用官方 ase.js 中的固定密钥，保持默认开启即可）
aj.captcha.aes-status=true
# local 缓存阈值，达到后清除缓存
aj.captcha.cache-number=1000
# local 定时清理过期缓存（单位秒）
aj.captcha.timing-clear=180

# ---- 接口频控：验证码接口本身的防刷限流 ----
aj.captcha.req-frequency-limit-enable=true
# 验证失败 5 次锁定 get 接口
aj.captcha.req-get-lock-limit=5
# 锁定时长（秒）
aj.captcha.req-get-lock-seconds=10
# get 接口一分钟内请求数上限
aj.captcha.req-get-minute-limit=30
# check 接口一分钟内请求数上限
aj.captcha.req-check-minute-limit=60
# verification 接口一分钟内请求数上限
aj.captcha.req-verify-minute-limit=60

# ==================== 验证码缓存模式（三选一） ====================
# 模式一 local（默认）：aj.captcha.cache-type=local，进程内存缓存，无需任何 Redis，单机部署使用
#
# 模式二 FakeRedis：  --spring.profiles.active=fake-redis
#                     本机未安装 Redis 的学员用。jedis-mock 在进程内启动内存版 Redis 服务端（端口 6399），
#                     缓存同样走 aj.captcha.cache-type=redis + RedisCaptchaServiceImpl 真实链路，
#                     配置见 application-fake-redis.properties
#
# 模式三 真实 Redis：  --spring.profiles.active=real-redis
#                     本机/远程已安装 Redis 的学员用，配置见 application-real-redis.properties。
#                     与 FakeRedis 模式仅服务端不同，应用代码零改动，随时可互换
