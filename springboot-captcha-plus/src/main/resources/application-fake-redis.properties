# ==================== 模式二：FakeRedis（本机未安装 Redis 时使用） ====================
# 启动方式：--spring.profiles.active=fake-redis
# 由 FakeRedisConfiguration 在进程内拉起 jedis-mock 内存版 Redis 服务端，
# 验证码缓存走真实的 RedisCaptchaServiceImpl + StringRedisTemplate 链路（只是服务端是假的）。

# 切换验证码缓存实现为 redis（对应 META-INF/services SPI 注册的 RedisCaptchaServiceImpl）
aj.captcha.cache-type=redis

# FakeRedis 监听端口（与 FakeRedisConfiguration 共用此配置，端口冲突时只改这里）
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6399
